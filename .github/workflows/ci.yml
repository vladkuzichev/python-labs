name: Checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python scripts/download_model.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run pytest --cov=findex --benchmark-save=ci
      - run: uv run pytest tests/test_benchmark.py --benchmark-compare=docs/benchmark_baseline.json --benchmark-compare-fail=mean:99%
