[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.7.0"
description = "Пошукова система над документацією стандартної бібліотеки Python"
requires-python = ">=3.12"
dependencies = [
  "typer==0.16.0", "rich==14.0.0", "httpx==0.28.1",
  "fastapi==0.115.14", "uvicorn==0.35.0", "pydantic-settings==2.10.1", "jinja2==3.1.6",
  "numpy==2.2.6", "onnxruntime==1.22.0", "tokenizers==0.21.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1", "pytest-cov==6.2.1", "hypothesis==6.135.26", "pytest-benchmark==5.1.0",
  "ruff==0.12.1", "pyright==1.1.402", "mypy==1.16.1", "psutil==7.0.0", "matplotlib==3.10.3",
  "py-spy==0.4.0", "build==1.2.2.post1", "hatchling==1.27.0", "editables==0.5",
]

[project.optional-dependencies]
reports = ["python-docx==1.2.0", "pillow==11.3.0"]

[project.scripts]
findex = "findex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: перевірки тривалістю понад секунду", "benchmark: вимірювання продуктивності"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/findex"]
