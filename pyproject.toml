[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.1.0"
description = "Пошукова система над документацією стандартної бібліотеки Python"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
findex = "findex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: перевірки тривалістю понад секунду", "benchmark: вимірювання продуктивності"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/findex"]
